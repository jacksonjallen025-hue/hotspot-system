<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KARIBU NET — Lipa ili uunganike</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Segoe UI',sans-serif;
      background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
      min-height:100vh;display:flex;align-items:center;
      justify-content:center;padding:15px;
    }
    .card{
      background:white;border-radius:24px;padding:28px;
      width:100%;max-width:420px;
      box-shadow:0 25px 80px rgba(0,0,0,0.4);
    }
    .header{text-align:center;margin-bottom:22px}
    .header .icon{font-size:42px;margin-bottom:6px}
    .header h1{font-size:24px;color:#1a1a2e;font-weight:800}
    .header p{color:#666;font-size:13px;margin-top:4px}

    /* TABS */
    .tabs{display:flex;gap:8px;margin-bottom:22px}
    .tab{
      flex:1;padding:11px;border:2px solid #e8e8e8;
      border-radius:12px;background:white;cursor:pointer;
      font-weight:700;font-size:13px;transition:all 0.2s;
      color:#888;
    }
    .tab.active{border-color:#0f3460;background:#e8f0ff;color:#0f3460}

    /* PAYMENT SECTION */
    .section{display:none}
    .section.active{display:block}

    .section-title{
      font-size:13px;font-weight:700;color:#888;
      text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;
    }

    .packages{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
    .pkg{
      border:2px solid #e8e8e8;border-radius:14px;
      padding:14px 10px;text-align:center;cursor:pointer;
      transition:all 0.2s;background:#fafafa;
    }
    .pkg:hover{border-color:#0f3460;background:#f0f4ff}
    .pkg.selected{border-color:#0f3460;background:#e8f0ff;transform:scale(1.02)}
    .pkg.full{grid-column:span 2}
    .pkg .dur{font-weight:800;font-size:15px;color:#222}
    .pkg .pr{color:#0f3460;font-weight:900;font-size:17px;margin-top:4px}

    .form-group{margin-bottom:16px}
    .form-group label{
      display:block;color:#444;margin-bottom:6px;
      font-size:13px;font-weight:700;
    }
    .form-group input{
      width:100%;padding:13px 16px;border:2px solid #e8e8e8;
      border-radius:12px;font-size:16px;outline:none;
      transition:border 0.2s;background:#fafafa;
    }
    .form-group input:focus{border-color:#0f3460;background:white}

    .methods{display:flex;gap:10px;margin-bottom:20px}
    .method-btn{
      flex:1;padding:13px 8px;border:2px solid #e8e8e8;
      border-radius:12px;background:white;cursor:pointer;
      font-weight:700;font-size:13px;transition:all 0.2s;
      display:flex;flex-direction:column;align-items:center;gap:4px;
    }
    .dot{width:10px;height:10px;border-radius:50%}
    .method-btn.airtel .dot{background:#e53935}
    .method-btn.tigo .dot{background:#1565c0}
    .method-btn.selected{border-color:#0f3460;background:#e8f0ff}

    /* VOUCHER SECTION */
    .voucher-box{
      border:2px dashed #0f3460;border-radius:16px;
      padding:24px;text-align:center;background:#f8f9ff;
      margin-bottom:20px;
    }
    .voucher-box .v-icon{font-size:36px;margin-bottom:10px}
    .voucher-box p{color:#555;font-size:13px;margin-bottom:16px;line-height:1.5}
    .code-input{
      width:100%;padding:16px;border:3px solid #0f3460;
      border-radius:12px;font-size:22px;font-weight:800;
      text-align:center;letter-spacing:6px;text-transform:uppercase;
      outline:none;background:white;color:#0f3460;
    }

    .pay-btn{
      width:100%;padding:16px;
      background:linear-gradient(135deg,#0f3460,#1a1a2e);
      color:white;border:none;border-radius:14px;
      font-size:17px;font-weight:800;cursor:pointer;
      transition:opacity 0.2s;
    }
    .pay-btn:disabled{opacity:0.4;cursor:not-allowed}

    .msg{
      text-align:center;padding:14px;border-radius:12px;
      margin-top:14px;display:none;font-weight:600;font-size:14px;line-height:1.6;
    }
    .msg.success{background:#e8f5e9;color:#1b5e20}
    .msg.error{background:#ffebee;color:#b71c1c}
    .msg.waiting{background:#fff8e1;color:#e65100}

    .spinner{
      display:inline-block;width:18px;height:18px;
      border:3px solid rgba(255,255,255,0.3);border-radius:50%;
      border-top-color:white;animation:spin 0.8s linear infinite;
      margin-right:8px;vertical-align:middle;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .footer{text-align:center;margin-top:16px;color:#aaa;font-size:11px}
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="icon">📶</div>
    <h1>KARIBU NET</h1>
    <p>Chagua njia ya kuunganika</p>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('pay',this)">
      💳 Lipa na Simu
    </button>
    <button class="tab" onclick="switchTab('voucher',this)">
      🎫 Voucher Code
    </button>
  </div>

  <!-- PAY SECTION -->
  <div id="paySection" class="section active">
    <div class="section-title">📦 Chagua Package</div>
    <div class="packages" id="pkgContainer">
      <div style="grid-column:span 2;text-align:center;color:#888;padding:20px">Inapakia...</div>
    </div>

    <div class="form-group">
      <label>📱 Namba ya Simu</label>
      <input type="tel" id="phone" placeholder="0754 000 000 au 0654 000 000" maxlength="13">
    </div>

    <div class="section-title">💳 Njia ya Kulipa</div>
    <div class="methods">
      <button class="method-btn airtel" onclick="selectMethod('airtel',this)">
        <div class="dot"></div><span>Airtel Money</span>
      </button>
      <button class="method-btn tigo" onclick="selectMethod('tigo',this)">
        <div class="dot"></div><span>Tigo Pesa</span>
      </button>
    </div>

    <button class="pay-btn" id="payBtn" onclick="pay()" disabled>
      💰 LIPA SASA
    </button>
    <div class="msg" id="payMsg"></div>
  </div>

  <!-- VOUCHER SECTION -->
  <div id="voucherSection" class="section">
    <div class="voucher-box">
      <div class="v-icon">🎫</div>
      <p>Una voucher code? Ingiza hapa chini kupata internet yako mara moja bila kulipa tena.</p>
      <input type="text" class="code-input" id="voucherCode" 
             placeholder="XXXXXX" maxlength="8"
             oninput="this.value=this.value.toUpperCase()">
    </div>

    <button class="pay-btn" id="voucherBtn" onclick="redeemVoucher()">
      🎫 TUMIA CODE
    </button>
    <div class="msg" id="voucherMsg"></div>
  </div>

  <div class="footer">KARIBU NET — Tanzania WiFi</div>
</div>

<script>
  let selPkg=null, selMethod=null, txId=null, poll=null;

  // Get MAC address (approximate via session)
  const MAC = 'web-' + Math.random().toString(36).substring(2,10);

  // Switch tabs
  function switchTab(tab, el) {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById(tab==='pay'?'paySection':'voucherSection').classList.add('active');
  }

  // Load packages
  fetch('/api/packages').then(r=>r.json()).then(pkgs=>{
    const c = document.getElementById('pkgContainer');
    c.innerHTML='';
    const entries = Object.entries(pkgs);
    entries.forEach(([id,p],i)=>{
      const isLast = i === entries.length-1;
      const isOdd = entries.length % 2 !== 0;
      const d = document.createElement('div');
      d.className = 'pkg' + (isLast && isOdd ? ' full' : '');
      d.dataset.id = id;
      d.innerHTML = `<div class="dur">${p.name}</div><div class="pr">TSh ${p.price.toLocaleString()}</div>`;
      d.onclick = ()=>selectPkg(id,d);
      c.appendChild(d);
    });
  });

  function selectPkg(id,el){
    document.querySelectorAll('.pkg').forEach(p=>p.classList.remove('selected'));
    el.classList.add('selected');
    selPkg=id; checkReady();
  }

  function selectMethod(m,el){
    document.querySelectorAll('.method-btn').forEach(b=>b.classList.remove('selected'));
    el.classList.add('selected');
    selMethod=m; checkReady();
  }

  function checkReady(){
    const ph=document.getElementById('phone').value.replace(/\s/g,'');
    document.getElementById('payBtn').disabled=!(selPkg&&selMethod&&ph.length>=10);
  }
  document.getElementById('phone').addEventListener('input',checkReady);

  // ============ PAY ============
  async function pay(){
    const phone=document.getElementById('phone').value.replace(/\s/g,'');
    const btn=document.getElementById('payBtn');
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span>Inatuma ombi...';

    try{
      const r=await fetch('/api/pay',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({phone,package:selPkg,mac:MAC,method:selMethod})
      });
      const d=await r.json();
      if(d.success){
        txId=d.transaction_id;
        showMsg('payMsg','waiting','⏳ '+d.message+'\n\nIngiza PIN yako kwenye simu.');
        btn.innerHTML='<span class="spinner"></span>Inasubiri malipo...';
        poll=setInterval(checkStatus,5000);
        setTimeout(()=>{
          clearInterval(poll);
          if(btn.disabled){
            btn.disabled=false;btn.innerHTML='💰 LIPA SASA';
            showMsg('payMsg','error','⏰ Muda umepita. Jaribu tena.');
          }
        },180000);
      }else{
        showMsg('payMsg','error',d.message||'Hitilafu. Jaribu tena.');
        btn.disabled=false;btn.innerHTML='💰 LIPA SASA';
      }
    }catch(e){
      showMsg('payMsg','error','Hitilafu ya mtandao. Jaribu tena.');
      btn.disabled=false;btn.innerHTML='💰 LIPA SASA';
    }
  }

  async function checkStatus(){
    if(!txId)return;
    try{
      const r=await fetch('/api/status/'+txId);
      const d=await r.json();
      if(d.status==='active'){
        clearInterval(poll);
        showMsg('payMsg','success','✅ Umefanikiwa!\n📦 '+d.package+'\n⏰ Inaisha: '+new Date(d.expires).toLocaleTimeString('sw-TZ'));
        document.getElementById('payBtn').innerHTML='✅ UMEUNGANIKA!';
        setTimeout(()=>location.reload(),5000);
      }
    }catch(e){}
  }

  // ============ VOUCHER ============
  async function redeemVoucher(){
    const code=document.getElementById('voucherCode').value.trim().toUpperCase();
    const btn=document.getElementById('voucherBtn');

    if(code.length<4){
      showMsg('voucherMsg','error','Ingiza code sahihi.');
      return;
    }

    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span>Inaangalia code...';

    try{
      const r=await fetch('/api/voucher/redeem',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({code,mac:MAC})
      });
      const d=await r.json();
      if(d.success){
        showMsg('voucherMsg','success','✅ '+d.message+'\n\n📦 Package: '+d.package+'\n⏰ Inaisha: '+new Date(d.expires).toLocaleTimeString('sw-TZ')+'\n\nFurahia internet yako! 🎉');
        btn.innerHTML='✅ UMEUNGANIKA!';
        setTimeout(()=>location.reload(),5000);
      }else{
        showMsg('voucherMsg','error',d.message||'Code batili. Jaribu tena.');
        btn.disabled=false;btn.innerHTML='🎫 TUMIA CODE';
      }
    }catch(e){
      showMsg('voucherMsg','error','Hitilafu ya mtandao. Jaribu tena.');
      btn.disabled=false;btn.innerHTML='🎫 TUMIA CODE';
    }
  }

  function showMsg(id,type,text){
    const el=document.getElementById(id);
    el.className='msg '+type;
    el.style.display='block';
    el.innerHTML=text.replace(/\n/g,'<br>');
  }
</script>
</body>
</html>
